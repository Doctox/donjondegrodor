name: Publier le site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le dossier du jeu
        uses: actions/upload-pages-artifact@v3
        with:
          path: jeu
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
